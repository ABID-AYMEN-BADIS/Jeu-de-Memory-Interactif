version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: memory-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - memory-network

  backend:
    build: ./backend
    container_name: memory-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/memorygame
    depends_on:
      - mongodb
    networks:
      - memory-network

  frontend:
    build: ./frontend
    container_name: memory-frontend
    ports:
      - "3002:3000"
    depends_on:
      - backend
    networks:
      - memory-network

volumes:
  mongodb_data:

networks:
  memory-network:
    driver: bridge